<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shark Dodge 🦈</title>
<style>
:root{--bg:#f6f8fa;--panel:#fff;--text:#1f2328;--muted:#59636e;--accent:#0969da;--sea1:#8fd0ff;--sea2:#2b7bbf;--danger:#cf222e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--panel:#161b22;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--sea1:#12264d;--sea2:#070b16;--danger:#f85149;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1117;--panel:#161b22;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--sea1:#12264d;--sea2:#070b16;--danger:#f85149;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
body{display:flex;flex-direction:column;align-items:center;padding:16px}
h1{font-size:20px;margin:4px 0 2px}
.sub{color:var(--muted);font-size:12px;margin:0 0 12px;text-align:center}
.hud{display:flex;justify-content:space-between;width:100%;max-width:360px;font-size:14px;margin-bottom:8px}
.wrap{position:relative;width:100%;max-width:360px;border:2px solid var(--accent);border-radius:14px;overflow:hidden;background:var(--panel)}
canvas{display:block;width:100%;height:auto;touch-action:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(7,11,22,.72);color:#e6edf3;text-align:center;padding:20px}
.ov h2{margin:0;font-size:22px}.ov p{margin:0;font-size:13px;opacity:.85}
button{font:inherit;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 22px;font-weight:700;cursor:pointer}
.hide{display:none}
</style>
</head>
<body>
<h1>🦈 Shark Dodge</h1>
<p class="sub">Pegue os peixes 🐟 e fuja das bombas 💣</p>
<div class="hud"><span id="sc">Pontos: 0</span><span id="lv">❤️❤️❤️</span><span id="bs">Recorde: 0</span></div>
<div class="wrap">
  <canvas id="c" width="360" height="540"></canvas>
  <div class="ov" id="ov">
    <h2 id="ovt">Shark Dodge</h2>
    <p id="ovp">Setas / A D ou arraste o dedo para mover</p>
    <button id="go">Jogar</button>
  </div>
</div>
<script>
(function(){
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=360,H=540;
var ov=document.getElementById('ov'),ovt=document.getElementById('ovt'),ovp=document.getElementById('ovp');
var sc=document.getElementById('sc'),lv=document.getElementById('lv'),bs=document.getElementById('bs');
var best=0;try{best=+localStorage.getItem('sharkBest')||0}catch(e){}
bs.textContent='Recorde: '+best;
var css=getComputedStyle(document.documentElement);
var s,keys={},target=null,last=0,running=false;
function reset(){s={x:W/2,score:0,lives:3,items:[],t:0,flash:0}}
reset();
function spawn(){var bomb=Math.random()<Math.min(.5,.28+s.score*.004);
s.items.push({x:24+Math.random()*(W-48),y:-30,bomb:bomb,v:(130+Math.min(s.score*3,200))*(.85+Math.random()*.3)})}
function end(){running=false;if(s.score>best){best=s.score;try{localStorage.setItem('sharkBest',best)}catch(e){}}
bs.textContent='Recorde: '+best;ovt.textContent='Game Over 💀';ovp.textContent='Você fez '+s.score+' pontos';
document.getElementById('go').textContent='Jogar de novo';ov.classList.remove('hide')}
function upd(dt){
var sp=300,dir=0;if(keys.ArrowLeft||keys.a)dir=-1;if(keys.ArrowRight||keys.d)dir=1;
if(dir){s.x+=dir*sp*dt;target=null}else if(target!==null){var d=target-s.x;s.x+=Math.sign(d)*Math.min(Math.abs(d),sp*1.4*dt)}
s.x=Math.max(24,Math.min(W-24,s.x));
s.t-=dt;if(s.t<=0){spawn();s.t=Math.max(.32,.85-s.score*.01)}
if(s.flash>0)s.flash-=dt;
for(var i=s.items.length-1;i>=0;i--){var it=s.items[i];it.y+=it.v*dt;
if(Math.abs(it.x-s.x)<32&&Math.abs(it.y-(H-60))<32){
if(it.bomb){s.lives--;s.flash=.3;if(s.lives<=0){end()}}else{s.score++}
s.items.splice(i,1)}else if(it.y>H+30){s.items.splice(i,1)}}
sc.textContent='Pontos: '+s.score;lv.textContent=s.lives>0?'❤️'.repeat(s.lives):'💀'}
function draw(){
var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,css.getPropertyValue('--sea1')||'#12264d');g.addColorStop(1,css.getPropertyValue('--sea2')||'#070b16');
ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.textAlign='center';ctx.textBaseline='middle';
ctx.globalAlpha=.15;ctx.fillStyle='#fff';for(var b=0;b<6;b++){ctx.beginPath();ctx.arc((b*67+30)%W,H-((b*97+Date.now()/20)%H),4+b%3,0,7);ctx.fill()}
ctx.globalAlpha=1;
ctx.font='30px serif';
s.items.forEach(function(it){ctx.fillText(it.bomb?'💣':'🐟',it.x,it.y)});
ctx.font='46px serif';ctx.save();ctx.translate(s.x,H-60);if(s.flash>0)ctx.globalAlpha=.45;ctx.fillText('🦈',0,0);ctx.restore();
if(s.flash>0){ctx.fillStyle='rgba(248,81,73,.25)';ctx.fillRect(0,0,W,H)}}
function loop(ts){if(!running)return;var dt=Math.min(.05,(ts-last)/1000);last=ts;upd(dt);draw();if(running)requestAnimationFrame(loop)}
function start(){reset();ov.classList.add('hide');running=true;last=performance.now();requestAnimationFrame(loop)}
document.getElementById('go').onclick=start;
addEventListener('keydown',function(e){var k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=true;if(k.indexOf('Arrow')===0)e.preventDefault();if((k==='Enter'||k===' ')&&!running)start()});
addEventListener('keyup',function(e){var k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false});
function pt(e){var r=cv.getBoundingClientRect();target=(e.clientX-r.left)*W/r.width}
cv.addEventListener('pointerdown',pt);cv.addEventListener('pointermove',function(e){if(e.buttons||e.pointerType==='touch')pt(e)});
draw();
})();
</script>
</body>
</html>
